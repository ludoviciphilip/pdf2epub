<h2 id="h130">CAPÍTULO CXIX<br/><em>Não faça isso, querida!</em></h2>
<p>A leitora, que é minha amiga e abriu este livro com o fim de descansar a cavatina de ontem para a valsa de hoje, quer fechá-lo às pressas, ao ver que beiramos um abismo. Não faça isso, querida; eu mudo de rumo.</p>
